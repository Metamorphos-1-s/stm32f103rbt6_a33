  ctx.clearRect(0,0,width,height);
  const plotWidth=width-bounds.left-bounds.right;
  const usable=height-bounds.top-bounds.bottom-bounds.gap;
  const topPanel={y:bounds.top,h:usable*.64};
  const adcPanel={y:bounds.top+usable*.64+bounds.gap,h:usable*.36};
  const first=Math.max(0,lowerBound(viewStart)-1), last=Math.min(points.length,lowerBound(viewEnd)+2);
  const massRange=panelLimits(first,last,["gross","display","conditioned"]);
  const adcRange=panelLimits(first,last,["raw","filtered"]);
  function yFor(v,panel,limits){return panel.y+panel.h-(v-limits[0])/(limits[1]-limits[0])*panel.h;}
  ctx.font="11px system-ui";ctx.textBaseline="middle";
  for (const [panel,limits,unit,precision] of [[topPanel,massRange,"g",3],[adcPanel,adcRange,"counts",0]]) {
    ctx.fillStyle="#12243a";ctx.fillRect(bounds.left,panel.y,plotWidth,panel.h);
    for (let i=0;i<=4;i++) {
      const y=panel.y+panel.h*i/4;
      ctx.strokeStyle="#294057";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bounds.left,y);ctx.lineTo(width-bounds.right,y);ctx.stroke();
      const tick=limits[1]-(limits[1]-limits[0])*i/4;
      ctx.fillStyle="#a6bace";ctx.textAlign="right";
      ctx.fillText(tick.toFixed(precision),bounds.left-9,y);
    }
    ctx.fillStyle="#b1c6da";ctx.textAlign="left";ctx.fillText(unit,bounds.left+8,panel.y+11);
  }
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const x=bounds.left+plotWidth*i/ticks;
    ctx.strokeStyle="#23384f";ctx.beginPath();ctx.moveTo(x,topPanel.y);ctx.lineTo(x,adcPanel.y+adcPanel.h);ctx.stroke();
    ctx.fillStyle="#a3bad1";ctx.textAlign=i===0?"left":i===ticks?"right":"center";
    ctx.fillText(new Date(DATA.baseUtcMs+viewStart+(viewEnd-viewStart)*i/ticks).toISOString().slice(11,19),x,height-18);
  }
  ctx.save();ctx.beginPath();ctx.rect(bounds.left,topPanel.y,plotWidth,adcPanel.y+adcPanel.h-topPanel.y);ctx.clip();
  if (document.getElementById("markers").checked) {
    for(const event of DATA.events){
      if(event.t<viewStart || event.t>viewEnd) continue;
      const x=canvasX(event.t);
      ctx.strokeStyle=event.kind==="edge"?"#fd9b82":"#f4d58c";
      ctx.lineWidth=1.3;ctx.setLineDash(event.kind==="edge"?[]:[4,5]);
      ctx.beginPath();ctx.moveTo(x,topPanel.y);ctx.lineTo(x,adcPanel.y+adcPanel.h);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=ctx.strokeStyle;ctx.font="11px system-ui";ctx.textAlign="left";
      const identifier=event.label.toLowerCase().replace("_operator_confirmed","").replace("_","");
      const readable={unload1:"卸载 1",load2:"装载 2",unload2:"卸载 2"}[identifier] || identifier;
      ctx.fillText(readable+(event.kind==="edge"?" · 边沿":" · 确认"),
                   Math.min(x+4,width-110),topPanel.y+(event.kind==="edge"?17:34));
    }
  }
  function line(name,panel,limits){
    if(!active[name])return;
    ctx.beginPath();let started=false;
    for(let i=first;i<last;i++){
      const v=points[i][series[name]];
      if(v===null){started=false;continue;}
      const x=canvasX(points[i][0]);const y=yFor(v,panel,limits);
      if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=colors[name];ctx.lineWidth=name==="gross"?1.7:1.1;ctx.globalAlpha=name==="gross"?1:.78;ctx.stroke();ctx.globalAlpha=1;
  }
  for(const name of ["gross","conditioned","display"])line(name,topPanel,massRange);
  for(const name of ["raw","filtered"])line(name,adcPanel,adcRange);
  if(pointerX!==null && pointerX>=bounds.left && pointerX<width-bounds.right){
    ctx.strokeStyle="#c9deee";ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(pointerX,topPanel.y);ctx.lineTo(pointerX,adcPanel.y+adcPanel.h);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.restore();
  rangeLabel.textContent=`时间范围：${utc(viewStart)} — ${utc(viewEnd)} · ${(viewEnd-viewStart)/60000<2?((viewEnd-viewStart)/1000).toFixed(1)+" 秒":((viewEnd-viewStart)/60000).toFixed(1)+" 分钟"} · ${last-first} 条可见记录`;
}
function updateHover(x){
  pointerX=x;
  if(x<bounds.left || x>width-bounds.right){readout.textContent="将鼠标移到曲线上读取该位置的原始记录。";render();return;}
  const t=clamp(timeX(x),0,fullEnd);
  const i=lowerBound(t);
  const row=points[clamp(i>0 && (i===points.length || t-points[i-1][0]<points[i][0]-t)?i-1:i,0,points.length-1)];
  const near=DATA.events.filter(e=>Math.abs(e.t-row[0])<5000).map(e=>e.label).join(" · ");
  readout.textContent=`${utc(row[0])}  |  权威 ${labelNumber(row[1],6)} g  ·  面板 ${labelNumber(row[2],2)} g  ·  显示保持 ${labelNumber(row[3],3)} g  ·  raw ${row[4]??"—"} counts  ·  filtered ${row[5]??"—"} counts${near?"  |  "+near:""}`;
  render();
}
canvas.addEventListener("wheel",event=>{
  event.preventDefault();const box=canvas.getBoundingClientRect();
  zoom(Math.exp(clamp(event.deltaY,-500,500)*.002),event.clientX-box.left);
},{passive:false});
canvas.addEventListener("pointerdown",event=>{
  if(event.button!==0)return;
  canvas.setPointerCapture(event.pointerId);drag={x:event.clientX,start:viewStart,end:viewEnd};canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove",event=>{
  const box=canvas.getBoundingClientRect();const x=event.clientX-box.left;
  if(drag){const shift=(event.clientX-drag.x)*(drag.end-drag.start)/(width-bounds.left-bounds.right);setView(drag.start-shift,drag.end-shift);}
  updateHover(x);
});
function endDrag(){drag=null;canvas.classList.remove("dragging");}
canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("pointerleave",()=>{if(!drag){pointerX=null;readout.textContent="将鼠标移到曲线上读取该位置的原始记录。";render();}});
document.getElementById("fit").addEventListener("click",()=>{quickView.value="all";setView(0,fullEnd);});
quickView.addEventListener("change",()=>chooseQuickWindow(quickView.value));
document.getElementById("zoomIn").addEventListener("click",()=>zoom(.5,width/2));
document.getElementById("zoomOut").addEventListener("click",()=>zoom(2,width/2));
for(const box of document.querySelectorAll("input[data-series]"))box.addEventListener("change",()=>{active[box.dataset.series]=box.checked;render();});
document.getElementById("markers").addEventListener("change",render);
function updateMeta() {
  document.getElementById("meta").textContent=`${points.length.toLocaleString()} 个记录点 · ${utc(0)} 至 ${utc(fullEnd)}`;
}
updateMeta();
document.getElementById("warning").textContent=`注意：首次装载边沿未被记录；边沿标记由约 0.5 秒轮询推定，人工确认晚于真实动作。记录器没有独立的滤波重量（g）列。${DATA.missing.length?"缺失可选列："+DATA.missing.join("、")+"。":""}`;
new ResizeObserver(render).observe(canvas);
render();
if (location.protocol !== "file:" && new URLSearchParams(location.search).get("realtime") === "1") {
  const status = document.createElement("span");
  status.id = "realtimeStatus";
  status.style.cssText = "color:#9be3b1;font-size:12px;margin-left:auto";
  status.textContent = "实时连接中…";
  document.querySelector(".toolbar").appendChild(status);
  let follow = true;
  const followLabel = document.createElement("label");
  followLabel.innerHTML = '<input type="checkbox" id="followLive" checked> 跟随最新';
  document.querySelector(".toolbar").appendChild(followLabel);
  const followControl = followLabel.querySelector("input");
  followControl.addEventListener("change", () => {
    follow = followControl.checked;
    if (follow) setView(Math.max(0, fullEnd - 300000), fullEnd);
  });
  const pauseFollow = () => { follow = false; followControl.checked = false; };
  const stream = new EventSource("/events");
  stream.addEventListener("init", event => {
    const init = JSON.parse(event.data);
    DATA.baseUtcMs = init.baseUtcMs;
    points.length = 0;
    points.push(...(init.points || []));
    fullEnd = Math.max(2000, points.length ? points[points.length - 1][0] : 0);
    status.textContent = `实时连接 · ${init.port}`;
    status.style.color = "#9be3b1";
    updateMeta();
    if (follow) setView(Math.max(0, fullEnd - 300000), fullEnd);
    else render();
  });
  stream.onmessage = event => {
    const message = JSON.parse(event.data);
    if (!message.point) return;
    if (points.length && message.point[0] <= points[points.length - 1][0]) return;
    points.push(message.point);
    fullEnd = Math.max(2000, message.point[0]);
    updateMeta();
    if (follow) setView(Math.max(0, fullEnd - 300000), fullEnd);
    else render();
  };
  stream.onerror = () => { status.textContent = "实时连接中断，等待重连…"; status.style.color="#f2c98d"; };
  stream.addEventListener("fatal", event => {
    status.textContent = `采集已停止：${JSON.parse(event.data).error}`;
    status.style.color = "#f2a59d";
    stream.close();
  });
  canvas.addEventListener("pointerdown", pauseFollow);
  canvas.addEventListener("wheel", pauseFollow, {passive:true});
  quickView.addEventListener("change", pauseFollow);
  document.getElementById("zoomIn").addEventListener("click", pauseFollow);
  document.getElementById("zoomOut").addEventListener("click", pauseFollow);
}
</script>
</body>
</html>
